# One service: built React UI + /api (same as `npm start` locally).
# Mount a volume at /data and set DATA_DIR=/data (see README).

[build]
# Ensure devDependencies (Vite, TypeScript) install despite NODE_ENV=production
buildCommand = "npm ci --include=dev && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
