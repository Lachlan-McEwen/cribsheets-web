# One service: built React UI + /api (same as `npm start` locally).
# Mount a volume at /data and set DATA_DIR=/data (see README).

[build]
# Railpack already runs `npm install` with devDependencies (NPM_CONFIG_PRODUCTION=false).
# Do not run `npm ci` here — it races with the cached node_modules mount and fails with
# EBUSY on node_modules/.vite, leaving production stuck on the previous deploy.
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
