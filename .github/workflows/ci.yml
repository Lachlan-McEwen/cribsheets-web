name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (match Railway Railpack dev deps)
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Build (same command as railway.toml)
        run: npm run build
        env:
          RAILWAY_GIT_COMMIT_SHA: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}

  production-smoke:
    name: Production smoke (main only)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Railway deploy + health
        env:
          PRODUCTION_URL: https://new.cribsheets.com.au
        run: bash scripts/wait-for-production-health.sh

  deploy:
    name: Deploy via Railway CLI (optional)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy this commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skipping CLI deploy (Railway GitHub source should deploy on push)."
            exit 0
          fi
          railway up -y -c \
            --project d08d5bac-930b-4221-b630-a7900e875065 \
            --environment production \
            --service cribsheets-web \
            -m "GitHub Actions ${GITHUB_SHA}"
